// Read Gradle's selected components; never infer versions from dependency declarations.
import groovy.json.JsonOutput

gradle.projectsEvaluated {
    rootProject.tasks.register('jmanExportModel') {
        doLast {
            def contexts = []
            rootProject.allprojects.each { p ->
                def sets = p.extensions.findByName('sourceSets')
                if (sets != null) sets.each { ss ->
                    def conf = p.configurations.findByName(ss.compileClasspathConfigurationName)
                    if (conf != null && conf.canBeResolved) {
                        def artifacts = conf.incoming.artifacts.artifacts.collect { a ->
                            def id = a.id.componentIdentifier
                            def coordinate = id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier ? "${id.group}:${id.module}:${id.version}" : id.displayName
                            [path: a.file.canonicalPath, component: coordinate,
                             variant: a.variant.displayName,
                             attributes: a.variant.attributes.keySet().collectEntries { key -> [(key.name): a.variant.attributes.getAttribute(key).toString()] }]
                        }
                        contexts.add([project: p.path, sourceSet: ss.name, configuration: conf.name,
                            roots: ss.allJava.srcDirs.collect { it.canonicalPath }, artifacts: artifacts])
                    }
                }
            }
            def target = new File(System.getenv('JMAN_MODEL_PATH'))
            target.parentFile.mkdirs()
            target.text = JsonOutput.toJson([contexts: contexts])
        }
    }
}
